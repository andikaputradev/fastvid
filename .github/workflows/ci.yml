name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      PUBLIC_API_BASE_URL: http://localhost:4000
      IP_HASH_SECRET: dummy-ci-ip-hash-secret-32-bytes
      API_KEY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_SESSION_SECRET: dummy-ci-admin-session-secret-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
